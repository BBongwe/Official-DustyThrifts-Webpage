name: Deploy website code and branding to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dustythrifts-website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stage reviewed website files only
        run: |
          python3 .github/scripts/build_static_site.py --build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/dustythrifts-static-site"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Preview website sync on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          aws s3 sync "$RUNNER_TEMP/dustythrifts-static-site/" s3://dustythrifts.com \
            --dryrun \
            --no-follow-symlinks \
            --exclude "site.webmanifest" \
            --cache-control no-cache

      - name: Sync website code and branding only
        if: github.event_name == 'push'
        run: |
          aws s3 sync "$RUNNER_TEMP/dustythrifts-static-site/" s3://dustythrifts.com \
            --no-follow-symlinks \
            --exclude "site.webmanifest" \
            --cache-control no-cache

      - name: Upload web manifest with its JSON content type
        if: github.event_name == 'push'
        run: |
          aws s3 cp "$RUNNER_TEMP/dustythrifts-static-site/site.webmanifest" s3://dustythrifts.com/site.webmanifest \
            --content-type application/manifest+json \
            --cache-control no-cache \
            --only-show-errors

      - name: Invalidate CloudFront Cache
        if: github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
