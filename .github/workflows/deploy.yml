name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Sync public website files to S3
        run: |
          aws s3 sync . s3://dustythrifts.com \
            --no-follow-symlinks \
            --exclude "*" \
            --include "index.html" \
            --include "script.js" \
            --include "style.css" \
            --include "catalogue.json" \
            --include "success.html" \
            --include "favicon.ico" \
            --include "*.webp" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.png" \
            --include "*.avif" \
            --include "*.WEBP" \
            --include "*.JPG" \
            --include "*.JPEG" \
            --include "*.PNG" \
            --include "*.AVIF" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".aws/*" \
            --exclude "backend/*"

      - name: Upload web manifest with its JSON content type
        run: |
          aws s3 cp site.webmanifest s3://dustythrifts.com/site.webmanifest \
            --content-type application/manifest+json \
            --cache-control no-cache \
            --only-show-errors

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
